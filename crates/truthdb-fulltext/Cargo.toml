[package]
name = "truthdb-fulltext"
version = "0.1.0"
edition = "2024"
description = "TruthDB full-text search: tokenizer, CONTAINS-style queries and BM25 ranking over B+ trees on the shared log."

[dependencies]
truthdb-core = { workspace = true }
unicode-segmentation = "1.12.0"

[dev-dependencies]
truthdb-core = { workspace = true, features = ["test-hooks"] }
