[package]
name = "truthdb-object"
version = "0.1.0"
edition = "2024"
description = "TruthDB object engine: buckets, versioned objects and their bodies over the shared log."

[dependencies]
truthdb-core = { workspace = true }
truthdb-fulltext = { workspace = true }
md-5 = "0.10.6"
zstd = "0.13"
serde_json = { workspace = true }

[dev-dependencies]
truthdb-core = { workspace = true, features = ["test-hooks"] }
