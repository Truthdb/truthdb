[package]
name = "truthdb-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
truthdb-core = { workspace = true }
truthdb-relational = { workspace = true }
truthdb-search = { workspace = true }
truthdb-object = { workspace = true }
ring = "0.17"
truthdb-proto = { workspace = true }
truthdb-net = { workspace = true }
truthdb-sql = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
serde = { workspace = true }
csv = "1.4.0"
parquet = { version = "60.0.0", default-features = false, features = ["snap", "lz4", "flate2-zlib-rs", "brotli"] }
base64 = "0.22.1"
bytes = "1"

[dev-dependencies]
truthdb-core = { workspace = true, features = ["test-hooks"] }
truthdb-relational = { workspace = true, features = ["test-hooks"] }
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
