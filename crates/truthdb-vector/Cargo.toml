[package]
name = "truthdb-vector"
version = "0.1.0"
edition = "2024"
description = "TruthDB vector engine: S3 Vectors-style buckets, indexes and float32 vectors with metadata over the shared log, searched exactly."

[dependencies]
truthdb-core = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
truthdb-core = { workspace = true, features = ["test-hooks"] }
