# Embedded default config for truthdb
[network]
addr = "0.0.0.0"
port = 9623

[storage]
path = "truth.db"
size_gib = 10
wal_ratio = 0.05
metadata_ratio = 0.08
snapshot_ratio = 0.02
allocator_ratio = 0.02
reserved_ratio = 0.17
# The database's default collation: what a character column declared without an
# explicit COLLATE gets. Applied when the database file is created and stamped
# into it — an existing file keeps the collation it was created with, since its
# index keys are already encoded under it. Default: SQL_Latin1_General_CP1_CI_AS.
# default_collation = "Finnish_Swedish_CI_AS"

# TDS (SQL Server protocol) gateway. Disabled by default. When enabled, real
# SQL Server drivers (pytds, go-mssqldb with encrypt=disable) can connect.
# [tds]
# enabled = true
# addr = "0.0.0.0"
# port = 1433
# database = "truthdb"
#
#
# encryption: "off" never encrypts; "optional" (default) encrypts when the
# client asks; "required" refuses clients that will not encrypt, and needs
# tls_cert/tls_key.
# encryption = "optional"
# tls_cert = "/etc/truthdb/tls.crt"
# tls_key = "/etc/truthdb/tls.key"
#
# [tds.auth]  — FIRST-BOOT SEED ONLY. These username = password entries are
# hashed into catalog logins the first time the server starts; the catalog is
# then authoritative and is never consulted from this file for authentication.
# Once the built-in sa login exists this section is inert (editing it does not
# add, remove, or rotate a login — use CREATE/ALTER/DROP LOGIN). If no sa is set
# here, an sa login is still created but DISABLED. Send passwords over TLS: see
# encryption above.
# sa = "change-me"

# Physical replication. Disabled by default. Every member of a cluster shares
# the same cluster_uuid and shared_secret. A primary listens on port (TLS
# mandatory: tls_cert/tls_key) and streams WAL to standbys; a standby dials
# primary_addr, verifies the primary against tls_ca, and applies the stream.
# Seed a standby's database file with:  truthdb-cli restore --standby
# [replication]
# enabled = true
# role = "primary"            # or "standby"
# node_id = 1                 # unique per member (a standby's slot id)
# cluster_uuid = "8f0e7a34-2d51-4c11-9c9e-3f6d2a7b1c05"
# shared_secret = "change-me"
#
# Primary:
# addr = "0.0.0.0"
# port = 9624
# tls_cert = "/etc/truthdb/repl.crt"
# tls_key = "/etc/truthdb/repl.key"
# heartbeat_ms = 1000
# stall_timeout_ms = 30000    # tear down a totally silent connection (>= 2x heartbeat)
# max_slot_retain_bytes = 0   # 0 = unlimited: a lagging standby is never dropped
# synchronous_commit = false  # commits wait for a standby ack (availability-first)
# sync_timeout_ms = 10000     # the sync-commit wait bound; on timeout the link
#                             # degrades to NOT_SYNCHRONIZED and commits proceed
#
# Standby:
# primary_addr = "primary.example:9624"
# tls_ca = "/etc/truthdb/repl.crt"   # the primary's cert (or its CA)
# server_name = "primary.example"    # defaults to the host part of primary_addr
# reconnect_delay_ms = 1000
#
# [s3]
# S3-compatible HTTP API (path-style addressing, and virtual-hosted under
# `domains`). Requests are signed with
# AWS SigV4 using access keys created over the native protocol:
#   truthdb-cli> s3 create access key
# enabled = true
# addr = "0.0.0.0"
# port = 9000
# region = "us-east-1"
# tls_cert = "/etc/truthdb/s3.crt"   # both set = HTTPS
# tls_key = "/etc/truthdb/s3.key"
# restore_seconds = { expedited = 0, standard = 0, bulk = 0 }  # RestoreObject delay per tier
# domains = ["s3.example.com"]   # photos.s3.example.com/key = bucket photos, key "key"
#
# [kafka]
# Kafka-compatible listener for consumers of stream topics (TLS only). Clients
# authenticate with SASL PLAIN: username = an S3 account root's access key id,
# password = its secret; they see the topics that account owns
# (stream create topic <name> account <id>).
# enabled = true
# addr = "0.0.0.0"
# port = 9093
# advertised_host = "localhost"   # the host clients connect to (in the cert)
# tls_cert = "/etc/truthdb/kafka.crt"   # required
# tls_key = "/etc/truthdb/kafka.key"    # required
#
# [encryption]
# Encryption at rest: a database created while a master key is configured is
# encrypted (its pages, log, search snapshot, spill pages and backups); it, its
# backups and its standbys do not open without that key. One of:
# master_key_file = "/etc/truthdb/master.keys"  # lines "<id> <64 hex digits>",
#                                               # the first key current; mode 0600,
#                                               # owned by the server's user
# key_command = ["/usr/local/bin/truthdb-kms"]  # run with "wrap" or "unwrap" appended:
#                                               # wrap reads the database key as hex on
#                                               # stdin and prints its wrapped form;
#                                               # unwrap reads that and prints the hex key
# To encrypt an existing database: configure a master key here, restart, and
# run `encryption enable`; the server converts it in the background
# (`encryption status` shows progress). Standbys cannot follow the change:
# reseed them from a backup taken after `encryption status` shows it
# finished, and start a new backup chain with a full backup.
# To rotate the master key: put the new key first in the key file (keep the
# old one) and run `encryption rotate master key` on the primary and on every
# standby (each file holds its own copy of the wrapped key; a standby seeded
# from a backup started after the rotation succeeded already has the new
# one). Remove the old key only after every rotation reported success. A
# backup started before the rotation succeeded still needs the old key to
# restore, and so does anything seeded or restored from it.
# To replace the database key itself: run `encryption rotate database key`
# on the primary; the server rewrites everything under the new key in the
# background (`encryption status` shows progress), and the old one is gone
# once it finishes. As for `encryption enable`: reseed the standbys from a
# backup taken after `encryption status` shows it finished, and start a new
# backup chain with a full backup. A point-in-time restore cannot cross the
# rotation: take a log backup just before it.
